[project]
name = "mcp-logseq-db"
version = "0.2.8"
description = "DB-native MCP server for Logseq 2.x"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Office/Business :: News/Diary",
]
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
mcp-logseq-db = "mcp_logseq_db.server:main"

[project.urls]
Homepage = "https://github.com/LoveSkylark/mcp-logseq-db"
Repository = "https://github.com/LoveSkylark/mcp-logseq-db"
Issues = "https://github.com/LoveSkylark/mcp-logseq-db/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_logseq_db"]