[project]
name = "mcp-logseq-db"
version = "0.2.5"
description = "DB-native MCP server for Logseq 2.x"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=2,<3",
]

[project.scripts]
mcp-logseq-db = "mcp_logseq_db.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_logseq_db"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]