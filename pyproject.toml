[project]
name = "mcp-logseq-db"
version = "0.3.0"
description = "DB-native MCP server for Logseq 2.x"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Office/Business :: News/Diary",
]
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
mcp-logseq-db = "mcp_logseq_db.server:main"

[project.urls]
Homepage = "https://github.com/LoveSkylark/mcp-logseq-db"
Repository = "https://github.com/LoveSkylark/mcp-logseq-db"
Issues = "https://github.com/LoveSkylark/mcp-logseq-db/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_logseq_db"]

[tool.pytest.ini_options]
# `src` is also forced to the front of sys.path by tests/conftest.py. Both are
# kept: this covers plain collection, conftest covers the difference between
# `pytest` and `python -m pytest`.
pythonpath = ["src"]

# importlib mode stops pytest inserting test directories into sys.path, which
# is what lets a pip-installed copy shadow the working tree.
addopts = "--import-mode=importlib -ra --strict-markers"

testpaths = ["tests"]

# REQUIRED. The test suite writes async tests without @pytest.mark.asyncio and
# relies on auto mode to pick them up. Without this line pytest-asyncio is
# installed but idle, and every async test fails with "You need to install a
# suitable plugin for your async framework" -- which points at the plugin
# rather than at this setting.
asyncio_mode = "auto"

# Pinned explicitly: pytest-asyncio 0.24 warns without it and 1.0 changes the
# default, so leaving it unset makes behaviour depend on the installed version.
asyncio_default_fixture_loop_scope = "function"

markers = [
    "live: requires a running Logseq with LOGSEQ_API_TOKEN set. Deselected in containers and CI with `-m 'not live'`.",
]

filterwarnings = [
    "error::DeprecationWarning:mcp_logseq_db.*",
]
